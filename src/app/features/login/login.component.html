<section class="login">
  <div class="hero panel">
    <p class="eyebrow">{{ store.profile().directorate }}</p>
    <h1>{{ store.profile().name }}</h1>
    <p class="tag">Timetable Desk</p>

    @if (usingSupabase) {
      <div class="accounts">
        <div class="mode-tabs">
          <button
            type="button"
            class="btn"
            [class.secondary]="mode() !== 'signin'"
            (click)="mode.set('signin')"
          >
            Sign in
          </button>
          <button
            type="button"
            class="btn"
            [class.secondary]="mode() !== 'signup'"
            (click)="mode.set('signup')"
          >
            Create account
          </button>
        </div>

        <form (submit)="$event.preventDefault(); submit()">
          @if (mode() === 'signup') {
            <div class="field">
              <label>Full name</label>
              <input [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" name="fullName" />
            </div>
            <div class="field">
              <label>Role</label>
              <select [ngModel]="role()" (ngModelChange)="role.set($event)" name="role">
                <option value="admin">Admin</option>
                <option value="teacher">Teacher</option>
              </select>
            </div>
          }
          <div class="field">
            <label>Email</label>
            <input
              type="email"
              required
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              name="email"
              autocomplete="username"
            />
          </div>
          <div class="field">
            <label>Password</label>
            <input
              type="password"
              required
              minlength="6"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
              autocomplete="current-password"
            />
          </div>
          @if (error()) {
            <p class="err">{{ error() }}</p>
          }
          <button class="btn submit" type="submit" [disabled]="busy()">
            {{ busy() ? 'Please wait…' : mode() === 'signin' ? 'Sign in' : 'Create account' }}
          </button>
        </form>
      </div>
    } @else {
      <div class="accounts">
        <p class="demo-note">Demo mode</p>
        <div class="account-list">
          @for (user of users; track user.id) {
            <button type="button" class="account" (click)="enterDemo(user)">
              <strong>{{ user.fullName }}</strong>
              <span>{{ user.role }}</span>
            </button>
          }
        </div>
      </div>
    }
  </div>
</section>
