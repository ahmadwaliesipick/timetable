<section class="page">
  <div class="page-header">
    <div>
      <h1>Classes</h1>
      <p>Sections that appear on the weekly timetable.</p>
    </div>
  </div>

  <div class="desk-grid">
    <form class="panel" (submit)="$event.preventDefault(); save()">
      <h2>{{ editingId() ? 'Edit class' : 'Add class' }}</h2>
      <div class="grid-form cols-2">
        <div class="field">
          <label>Name</label>
          <input [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" placeholder="7A" />
        </div>
        <div class="field">
          <label>Grade</label>
          <input [ngModel]="grade()" (ngModelChange)="grade.set($event)" name="grade" placeholder="7" />
        </div>
      </div>
      <div class="row-actions">
        <button class="btn" type="submit">Save</button>
        <button class="btn secondary" type="button" (click)="startCreate()">Clear</button>
      </div>
    </form>

    <section class="panel">
      <h2>Sections</h2>
      @if (!store.classSections().length) {
        <div class="empty">No classes yet.</div>
      } @else {
        <div class="entity-list">
          @for (c of store.classSections(); track c.id) {
            <article class="entity-card">
              <div>
                <strong>{{ c.name }}</strong>
                <div class="muted">Grade {{ c.grade || '—' }}</div>
              </div>
              <div class="row-actions">
                <button class="btn ghost" type="button" (click)="startEdit(c)">Edit</button>
                <button class="btn ghost" type="button" (click)="remove(c.id)">Delete</button>
              </div>
            </article>
          }
        </div>
      }
    </section>
  </div>
</section>
